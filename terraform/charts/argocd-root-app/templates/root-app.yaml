apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  # No resources-finalizer here, deliberately. The cascade it triggers deletes
  # the argocd child Application — i.e. Argo CD itself — so the controller dies
  # mid-cascade and the remaining finalizers are never cleared, deadlocking
  # `terraform destroy`. Deleting the root app therefore orphans its children
  # instead of removing them; during teardown the nodes are going away anyway.
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: {{ .Values.path }}
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
