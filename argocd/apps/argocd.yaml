# Wave -1: Argo CD adopts the Helm release Terraform seeded in 09-argocd.tf.
# Runs before everything else so that a self-upgrade never happens midway
# through reconciling the rest of the platform.
#
# The chart version and values here must match terraform/09-argocd.tf. They
# start identical, so the first sync is a no-op adoption; after that this file
# is the source of truth and Terraform's copy is only used for cold bootstraps.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/denesbeck/dev-platform.git
    targetRevision: main
    path: argocd/platform/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The chart ships CRDs larger than the 262144-byte annotation limit that
      # client-side apply needs for last-applied-configuration.
      - ServerSideApply=true
