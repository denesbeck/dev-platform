# Wave -1: Argo CD adopts the Helm release Terraform seeded in 09-argocd.tf.
# Runs before everything else so that a self-upgrade never happens midway
# through reconciling the rest of the platform.
#
# Chart version and values both come from argocd/platform/argocd/ — the same
# files terraform/09-argocd.tf reads when it seeds the release — so the first
# sync is a no-op adoption by construction, with nothing to keep in sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/denesbeck/dev-platform.git
    targetRevision: main
    path: argocd/platform/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The chart ships CRDs larger than the 262144-byte annotation limit that
      # client-side apply needs for last-applied-configuration.
      - ServerSideApply=true
