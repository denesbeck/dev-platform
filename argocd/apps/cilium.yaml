# Wave 0: handover of the Cilium release Terraform installed in M1
# (terraform/05-cilium.tf). Values are byte-for-byte the same, so Argo CD
# adopts the existing release and reports Synced without restarting anything.
#
# After this app first reports Synced/Healthy, run:
#   terraform state rm helm_release.cilium
# otherwise Terraform and Argo CD both believe they own the release.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/denesbeck/dev-platform.git
    targetRevision: main
    path: argocd/platform/cilium
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  # With tls.ca.cert/key unset, the Cilium chart mints an ephemeral CA at
  # render time — so every Argo CD reconcile would produce different cert
  # material, leaving the app permanently OutOfSync and selfHeal rotating
  # Hubble's certs on every pass (which breaks relay -> agent mTLS until the
  # pods restart). Ignore the generated secrets and let the ones created at
  # install time stand.
  #
  # Verified: with these three ignored, the render is byte-identical to what
  # terraform/05-cilium.tf produces (26/29 resources match exactly; these are
  # the only 3 that don't). Revisit in M4 — cert-manager can own these instead
  # via tls.auto.method=certmanager.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: cilium-ca
      namespace: kube-system
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: hubble-server-certs
      namespace: kube-system
      jsonPointers:
        - /data
    - group: ""
      kind: Secret
      name: hubble-relay-client-certs
      namespace: kube-system
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      # Make an explicit sync honour ignoreDifferences too, not just the
      # drift detection that triggers automated sync.
      - RespectIgnoreDifferences=true
