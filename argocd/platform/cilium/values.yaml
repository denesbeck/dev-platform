# Mirror of the values in terraform/05-cilium.tf — they must stay identical or
# Argo CD will restart the CNI on adoption. See that file for why each Talos
# override is needed.
#
# After this app reports Synced, `terraform state rm helm_release.cilium` so
# Terraform stops claiming ownership.
cilium:
  # These three are NOT configuration — they restore keys that the Terraform
  # install emits but this umbrella chart would otherwise drop.
  #
  # The chart guards them with `hasKey`, and their chart defaults are null.
  # Helm removes null-valued keys when it coalesces subchart values into a
  # parent chart, so `hasKey` goes false here and cilium-config loses
  # debug-verbose / policy-cidr-match-mode / nodeport-addresses. All three
  # render to "" either way, but without them Argo CD reports the ConfigMap as
  # OutOfSync on adoption and selfHeal rewrites it. Setting them explicitly
  # makes the handover a true no-op.
  debug:
    verbose: ""
  policyCIDRMatchMode: []
  nodePort:
    addresses: []

  kubeProxyReplacement: true

  # Talos exposes a localhost API proxy on :7445, so cilium-agent can reach the
  # apiserver before a CNI exists.
  k8sServiceHost: localhost
  k8sServicePort: "7445"

  # Talos mounts cgroup2 at /sys/fs/cgroup directly.
  cgroup:
    autoMount:
      enabled: false
    hostRoot: /sys/fs/cgroup

  # Pod CIDRs come from the node spec, not Cilium's cluster pool.
  ipam:
    mode: kubernetes

  # Required for eBPF on Talos.
  securityContext:
    capabilities:
      ciliumAgent:
        - CHOWN
        - KILL
        - NET_ADMIN
        - NET_RAW
        - IPC_LOCK
        - SYS_ADMIN
        - SYS_RESOURCE
        - DAC_OVERRIDE
        - FOWNER
        - SETGID
        - SETUID
      cleanCiliumState:
        - NET_ADMIN
        - SYS_ADMIN
        - SYS_RESOURCE

  hubble:
    enabled: true
    relay:
      enabled: true
    ui:
      enabled: true
